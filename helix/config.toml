[editor]
auto-completion = false
color-modes = true
end-of-line-diagnostics = 'disable'
popup-border = 'all'
rainbow-brackets = true

[editor.cursor-shape]
insert = 'bar'
select = 'underline'

[editor.file-picker]
hidden = false

[editor.gutters]
layout = ['spacer', 'line-numbers', 'spacer']

[editor.statusline]
right = ['diagnostics', 'selections', 'file-type']

[editor.statusline.mode]
insert = 'I'
normal = 'N'
select = 'S'

[theme]
dark = 'modus_vivendi_tinted'
light = 'modus_operandi_tinted'
