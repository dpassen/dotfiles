theme = 'catppuccin_mocha'

[editor]
auto-completion = false
color-modes = true
popup-border = 'all'

[editor.cursor-shape]
insert = 'bar'
select = 'underline'

[editor.file-picker]
hidden = false

[editor.gutters]
layout = ['line-numbers', 'spacer']

[editor.inline-diagnostics]
cursor-line = 'warning'

[editor.statusline]
right = ['diagnostics', 'selections', 'file-type']

[editor.statusline.mode]
insert = 'I'
normal = 'N'
select = 'S'

[keys.normal.space.u]
c = ':sh forgelink copy "%{buffer_name}:%{selection_line_start}-%{selection_line_end}"'
o = ':sh forgelink open "%{buffer_name}:%{selection_line_start}-%{selection_line_end}"'

[keys.select.space.u]
c = ':sh forgelink copy "%{buffer_name}:%{selection_line_start}-%{selection_line_end}"'
o = ':sh forgelink open "%{buffer_name}:%{selection_line_start}-%{selection_line_end}"'
