theme = 'wolf-alabaster-dark'

[editor]
auto-completion = false
popup-border = 'all'

[editor.cursor-shape]
insert = 'bar'
select = 'underline'

[editor.file-picker]
hidden = false

[editor.gutters]
layout = ['line-numbers', 'spacer']

[editor.inline-diagnostics]
cursor-line = 'warning'

[editor.statusline]
right = ['diagnostics', 'selections', 'file-type']
